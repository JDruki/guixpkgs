name: Sync, build, and cache Guix packages

on:
  schedule:
    - cron: '0 0 * * 0' # Run weekly on Sundays
  workflow_dispatch: # Allow manual triggers

permissions:
  contents: write

concurrency:
  group: sync-guixpkgs
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GuixPkgs
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v25
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Install Guix
        uses: PromyLOPh/guix-install-action@v1

      - name: Configure Cachix
        uses: cachix/cachix-action@v17
        with:
          name: jdruki-guixpkgs
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      - name: Run Sync App
        run: nix run .#sync

      # Nix only includes tracked or staged files when it evaluates a Git flake.
      # The sync creates the new podman wrapper, so stage generated output before
      # asking the flake for .#podman.
      - name: Stage generated package set
        run: git add pkgs guix-metadata.json

      - name: Verify and build Podman
        run: |
          test -f pkgs/by-name/p/podman.nix
          # libseccomp's Autoconf macros invoke m4_esyscmd, which uses /bin/sh.
          # Keep Nix's sandbox shell available; only disable the syscall filter
          # needed by the translated Guix bootstrap.
          nix build --print-build-logs .#podman \
            --option filter-syscalls false

      - name: Commit and Push Changes
        run: |
          git config user.name "みさき りゅう"
          git config user.email "86152294+JDruki@users.noreply.github.com"
          git add pkgs guix-metadata.json
          
          # Only commit if there are actually changes
          if ! git diff-index --quiet HEAD; then
            git commit -m "chore: Auto-sync Guix pkgs from upstream"
            git push
          else
            echo "No changes to upstream Guix packages detected."
          fi
